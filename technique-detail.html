<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Meditation technique guide.">
  <meta name="theme-color" content="#090910">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Technique — ADIYOGI</title>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <a class="logo" href="index.html"><span class="logo-dot"></span>ADIYOGI</a>
    <button class="icon-btn" data-action="toggle-theme" aria-label="Toggle theme">
      <span class="theme-dark">☀️</span><span class="theme-light" style="display:none">🌙</span>
    </button>
  </div>
</header>

<main>
  <div class="page">
    <div style="padding-top:14px">
      <a href="techniques.html" class="back">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Techniques
      </a>
    </div>
    <div id="content">
      <div style="text-align:center;padding:80px 0;color:var(--dim)">
        <div style="font-size:2.5rem;margin-bottom:10px">🧘</div>
        <p style="font-size:0.85rem">Loading…</p>
      </div>
    </div>
  </div>
</main>

<nav class="nav">
  <div class="nav-list">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Home
    </a>
    <a href="techniques.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Techniques
    </a>
    <a href="about.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0112 0v2"/></svg>
      About
    </a>
  </div>
</nav>

<!-- Timer overlay -->
<div class="t-overlay" id="timerOverlay">
  <div class="t-ring">
    <svg viewBox="0 0 230 230">
      <circle class="tr-bg"  cx="115" cy="115" r="108"/>
      <circle class="tr-arc" cx="115" cy="115" r="108" id="timerArc"/>
    </svg>
    <div class="t-inner">
      <div class="t-time"  id="timerTime">10:00</div>
      <div class="t-phase">remaining</div>
    </div>
  </div>
  <div class="t-name" id="timerName">Meditation</div>
  <div class="t-dur"  id="timerDur">10 minute session</div>
  <div class="t-ctrls">
    <button class="t-btn" id="timerClose">✕</button>
    <button class="t-btn t-play" id="timerPlay">▶</button>
    <button class="t-btn" id="timerReset">↺</button>
  </div>
  <div class="t-breath">Breathe in… and out…</div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const t = TECHNIQUES.find(x => x.id === params.get('id')) || TECHNIQUES[0];
  document.title = `${t.title} — ADIYOGI`;

  let selDur = t.durations[Math.min(1, t.durations.length - 1)];

  function updateStartBtn() {
    document.querySelectorAll('.start-btn').forEach(b => {
      b.textContent = `Begin ${selDur.time}-min session`;
      b.onclick = () => window.openTimer(selDur.time, t.title);
    });
  }

  document.getElementById('content').innerHTML = `
    <div class="detail-hero">
      <span class="detail-emoji">${t.emoji}</span>
      <p class="detail-cat">${t.category}</p>
      <h1 class="detail-title">${t.title}</h1>
      <p class="detail-sub">${t.subtitle}</p>
      <p class="detail-tagline">${t.tagline}</p>
    </div>

    <div class="media-box">
      <div class="media-fallback" id="mf" style="display:none">
        <span>${t.emoji}</span><span class="mf-label">Visual guide</span>
      </div>
      <img src="${t.gifUrl}" alt="${t.gifAlt}" loading="lazy"
        onerror="this.style.display='none';document.getElementById('mf').style.display='flex'">
    </div>

    <p style="font-size:0.88rem;color:var(--muted);line-height:1.75;white-space:pre-line">${t.description}</p>

    <div style="margin-top:22px">
      <p class="sec-label">Duration</p>
      <div class="dur-row" id="durRow">
        ${t.durations.map((d,i)=>`
          <button class="dur-btn${i===Math.min(1,t.durations.length-1)?' on':''}" data-i="${i}">
            <span class="dt">${d.label}</span>
            <span class="dl">${d.description}</span>
          </button>`).join('')}
      </div>
      <button class="btn btn-primary btn-full start-btn" style="margin-top:4px">Begin ${selDur.time}-min session</button>
    </div>

    <div class="divider">Guide</div>
    <div class="steps">
      ${t.steps.map((s,i)=>`<div class="step"><div class="step-n">${i+1}</div><p>${s}</p></div>`).join('')}
    </div>

    <div class="tip">
      <div style="font-size:1.1rem;flex-shrink:0">💡</div>
      <div>
        <p class="tip-label">Tip</p>
        <p>${t.tip}</p>
      </div>
    </div>

    <div class="divider">Benefits</div>
    <div class="benefits">
      ${t.benefits.map(b=>`<div class="benefit"><span class="benefit-dot">✦</span><p>${b}</p></div>`).join('')}
    </div>

    <div style="padding:28px 0 8px;text-align:center">
      <button class="btn btn-primary btn-full start-btn">Begin ${selDur.time}-min session</button>
    </div>

    <div class="divider">More</div>
    <div class="grid" id="moreGrid"></div>
    <div style="height:14px"></div>
  `;

  // Duration picker
  document.getElementById('durRow').addEventListener('click', e => {
    const b = e.target.closest('.dur-btn'); if (!b) return;
    document.querySelectorAll('.dur-btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    selDur = t.durations[+b.dataset.i];
    updateStartBtn();
  });
  updateStartBtn();

  // More techniques
  const others = TECHNIQUES.filter(x => x.id !== t.id).slice(0, 2);
  document.getElementById('moreGrid').innerHTML = others.map(o=>`
    <a href="technique-detail.html?id=${o.id}" class="card">
      <div class="card-thumb" style="background:${o.gradient}">
        <span>${o.emoji}</span>
        <span class="card-tag">${o.category}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${o.title}</div>
        <div class="card-sub">${o.subtitle}</div>
        <div class="card-chips">
          ${o.durations.slice(0,2).map(d=>`<span class="chip">${d.label}</span>`).join('')}
        </div>
      </div>
    </a>`).join('');

  // Reveal
  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal').forEach(el => {
      new IntersectionObserver(([e],o)=>{ if(e.isIntersecting){el.classList.add('visible');o.disconnect();} },{threshold:0.05}).observe(el);
    });
  });
});
</script>
</body>
</html>
